schema_version = "1.3"

[task]
name = "ollama-harness/hello-file"
description = "Smoke test for running the Ollama agent harness under Harbor."
authors = [{ name = "Ollama" }]
keywords = ["smoke", "local-model", "ollama"]

[metadata]
difficulty = "easy"
category = "filesystem"

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "public"
